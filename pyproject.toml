[project]
name = "vaultdir"
version = "0.0.8"
description = "Encrypt and decrypt directories with a password"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=47.0.0",
]

[project.urls]
Repository = "https://github.com/diversen/vaultdir"
Documentation = "https://github.com/diversen/vaultdir/blob/main/docs.md"
"Legal note" = "https://github.com/diversen/vaultdir/blob/main/legal.md"

[project.scripts]
vaultdir = "main:main"
